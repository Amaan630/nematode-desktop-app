<!doctype html>
<!-- Renders icons for scripts/icons.sh:
     ?v=soft                            Soft Pink app icon (the default): Croissant in full color on the site's pink
     ?v=pinkblue|acid|halftone|purple   the dithered app icons
     ?char=<id>                         a character's Character-menu preview (square)
     ?tray=<id>                         a character's menu bar icon, trimmed to his outline; its size goes in the title -->
<style>html, body { margin: 0; background: transparent }</style>
<canvas width="1024" height="1024"></canvas>
<script>
const CHARACTERS = {};
const q = new URLSearchParams(location.search), who = q.get('char') || q.get('tray');
// The dithered icons are drawn from Nematode, Soft Pink from Croissant; character renders load that character's file.
for (const id of new Set(['nematode', 'croissant', who].filter(Boolean))) document.write(`<script src="../src/characters/${id}.js"><\/script>`);
</script>
<script>
const out = document.querySelector('canvas'), ctx = out.getContext('2d');

// macOS icon grid: an 824px squircle centered in 1024.
function squircle() {
  const p = new Path2D(), n = 4.2, r = 412;
  for (let i = 0; i <= 360; i++) {
    const a = i / 360 * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    const X = 512 + r * Math.sign(c) * Math.abs(c) ** (2 / n), Y = 512 + r * Math.sign(s) * Math.abs(s) ** (2 / n);
    i ? p.lineTo(X, Y) : p.moveTo(X, Y);
  }
  return p;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

// Grayscale source: him alone, lit from the top-left, over solid black (which becomes flat ink).
function source(size, scale = .5, x0 = .5, ground = .77) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  // A light outline gives the dithered icons their crisp rim (he's dark-outlined everywhere else).
  const line = NEMA_COLORS.line; NEMA_COLORS.line = '#efd99b';
  drawNematode(x, { x: size * x0, ground: size * ground, scale: size * scale, face: -1 });
  NEMA_COLORS.line = line;
  x.globalCompositeOperation = 'source-atop';
  const g = x.createLinearGradient(size * .25, size * .15, size * .8, size * .9);
  g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.globalCompositeOperation = 'destination-over';
  x.fillStyle = '#000'; x.fillRect(0, 0, size, size);
  return x.getImageData(0, 0, size, size);
}

// Ordered (Bayer) dither to two inks; the black backdrop stays solid ink.
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function dither(img, ink, paper, contrast = 1.35) {
  const [a, b] = [hex(ink), hex(paper)], d = img.data, w = img.width;
  for (let i = 0; i < d.length; i += 4) {
    const px = (i / 4) % w, py = Math.floor(i / 4 / w);
    let l = (.3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2]) / 255;
    l = l < .04 ? 0 : Math.min(1, Math.max(.06, (l - .5) * contrast + .55));
    const c = l > (BAYER[py % 4][px % 4] + .5) / 16 ? b : a;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  return img;
}
// Draw a low-res dither into (x, y, size), hard pixels.
function pixels(img, x, y, size) {
  const t = document.createElement('canvas'); t.width = t.height = img.width;
  t.getContext('2d').putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(t, x, y, size, size);
}

// Any character, standing, drawn big through its own overlay adapter and trimmed to its outline.
function trimmed(id) {
  const big = document.createElement('canvas'); big.width = big.height = 2048;
  const b = big.getContext('2d');
  CHARACTERS[id].draw(b, { x: 1024, ground: 1600, face: 1, rot: 0, accel: [0, 0], dt: 1 / 60, now: 1000, zoom: 12 },
    { state: 'idle', phase: 0, t: 0, stretch: 1, hop: 0, crouch: 0, impact: 0, airborne: false });
  const d = b.getImageData(0, 0, 2048, 2048).data;
  let x0 = 2048, y0 = 2048, x1 = 0, y1 = 0;
  for (let y = 0; y < 2048; y++) for (let x = 0; x < 2048; x++) {
    if (d[(y * 2048 + x) * 4 + 3] > 60) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  return { img: big, x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

const variants = {
  soft: () => { // flat site pink, Croissant in full color with even padding
    ctx.fillStyle = '#ffc9d9'; ctx.fillRect(0, 0, 1024, 1024);
    const t = trimmed('croissant'), k = 1024 * .56 / Math.max(t.w, t.h);
    ctx.drawImage(t.img, t.x0, t.y0, t.w, t.h, 512 - t.w * k / 2, 528 - t.h * k / 2, t.w * k, t.h * k);
  },
  pinkblue: () => pixels(dither(source(120), '#2020ff', '#ff6fae'), 0, 0, 1024),
  acid: () => pixels(dither(source(120), '#101010', '#e9ff3b'), 0, 0, 1024),
  halftone: () => { // light dots on a solid red field, dot size follows brightness
    const img = source(1024), d = img.data, cell = 22;
    ctx.fillStyle = '#ef3b2c'; ctx.fillRect(0, 0, 1024, 1024); ctx.fillStyle = '#f6efdc';
    for (let y = cell / 2; y < 1024; y += cell) for (let x = cell / 2; x < 1024; x += cell) {
      const i = (Math.floor(y) * 1024 + Math.floor(x)) * 4;
      const r = cell * .66 * Math.sqrt(Math.min(1, (.3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2]) / 255 * 1.2));
      if (r > .5) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    }
  },
  purple: () => pixels(dither(source(120), '#3b0a6b', '#ff9a2e'), 0, 0, 1024),
};

// Character renders fit into the frame: square for the menu preview, as wide or tall as it is for the menu bar icon.
function renderCharacter(id, square) {
  const { img: big, x0, y0, w, h } = trimmed(id);
  const room = square ? 960 : 1024, k = room / Math.max(w, h);
  ctx.drawImage(big, x0, y0, w, h, 512 - w * k / 2, 512 - h * k / 2, w * k, h * k);
  document.title = `${Math.round(w * k)} ${Math.round(h * k)}`; // icons.sh crops the menu bar icon to this
}

if (who) {
  renderCharacter(who, q.has('char'));
} else {
  ctx.save(); ctx.clip(squircle());
  (variants[q.get('v')] || variants.pinkblue)();
  ctx.restore();
}
</script>
