<!doctype html>
<!-- Background for the install window (540x380 points). Icons sit at x=140 and x=400, y=170 (see scripts/dmg.py). -->
<style>
  html, body { margin: 0; width: 540px; height: 380px; overflow: hidden; background: #faf9f6;
               font: 13px system-ui, -apple-system, sans-serif; color: #86868b }
  svg { position: absolute; left: 0; top: 0 }
  p { position: absolute; bottom: 34px; width: 100%; text-align: center; margin: 0 }
</style>
<svg width="540" height="380" viewBox="0 0 540 380">
  <!-- Hand-drawn arrow: a marker arc with a slight wobble (turbulence displacement), arching over the gap. -->
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <g fill="none" stroke="#ff6fae" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)">
    <path d="M214 176 C 244 132, 292 128, 322 166"/>
    <path d="M305 161 L 323 168 L 322 149"/>
  </g>
</svg>
<p>Drag Nematode into Applications</p>
