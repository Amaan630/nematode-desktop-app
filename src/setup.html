<!doctype html>
<meta charset="utf-8">
<title>Nematode</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f6; --text: #1d1d1f; --muted: #86868b; --btn: #1d1d1f; --btn-text: #fff; --ok: #5f8a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --text: #f5f5f7; --muted: #98989d; --btn: #f5f5f7; --btn-text: #1d1d1f; --ok: #a3c46f; }
  }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body {
    font: 13px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg); text-align: center;
    display: flex; flex-direction: column; align-items: center; padding: 44px 32px 0; box-sizing: border-box;
    user-select: none; -webkit-app-region: drag;
  }
  canvas { width: 56px; height: 64px }
  h1 { margin: 12px 0 4px; font-size: 17px; font-weight: 600 }
  p { margin: 0; color: var(--muted); max-width: 100%; text-wrap: balance }
  .action { height: 72px; margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px }
  button {
    -webkit-app-region: no-drag; font: inherit; font-weight: 500; color: var(--btn-text); background: var(--btn);
    border: 0; border-radius: 8px; padding: 7px 18px; cursor: default;
  }
  button:active { opacity: .8 }
  .ok { color: var(--ok); font-weight: 600; font-size: 14px; line-height: 31px }
  [hidden] { display: none !important }
</style>

<canvas width="112" height="128" aria-hidden="true"></canvas>
<h1>Nematode</h1>
<p>He needs Accessibility to find your tab.</p>

<div class="action">
  <button id="allow">Allow</button>
  <p id="hint" hidden>Turn on Nematode, then come back.</p>
  <span class="ok" id="ok" hidden>✓ All set</span>
</div>

<script src="characters/nematode.js"></script>
<script>
const invoke = window.__TAURI__?.core.invoke ?? (async () => false);
const allow = document.getElementById('allow'), hint = document.getElementById('hint'), ok = document.getElementById('ok');
let asked = false, granted = false, hopAt = -1;

// States: not asked → asked (Settings + hint) → granted (✓, hop, close).
allow.onclick = () => {
  invoke('request_accessibility', { settings: asked });
  asked = true;
  allow.textContent = 'Open System Settings';
  hint.hidden = false;
};
async function refresh() {
  if (granted || !(await invoke('status'))) return;
  granted = true;
  allow.hidden = hint.hidden = true;
  ok.hidden = false;
  hopAt = performance.now();
  setTimeout(() => invoke('close_setup'), 1600);
}
refresh(); setInterval(refresh, 700);

const x = document.querySelector('canvas').getContext('2d');
x.scale(2, 2);
(function loop(t) {
  const b = Math.sin(t / 500), h = hopAt < 0 ? 0 : Math.max(0, Math.sin(Math.min(1, (t - hopAt) / 450) * Math.PI));
  x.clearRect(0, 0, 56, 64);
  drawNematode(x, { x: 28, ground: 60, scale: 46, face: -1, hop: 8 * h, mouth: 1 + .2 * h,
                    stretch: 1 + .03 * b + .06 * h, curl: 1 - .04 * b });
  requestAnimationFrame(loop);
})(0);
</script>
