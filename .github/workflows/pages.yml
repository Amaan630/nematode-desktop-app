# Publishes the website (site/) to GitHub Pages, with the app's own drawing code and icons.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/characters/**', 'build/icon-*.png', 'src-tauri/icons/characters/**', 'scripts/og-card.html', 'scripts/favicon.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/icons _site/characters
          cp site/index.html site/favicon.js _site/
          cp src/characters/*.js _site/characters/
          cp build/icon-*.png src-tauri/icons/characters/*-menu.png _site/icons/
      - name: Render the link-preview card and fixed icons from the current characters
        run: |
          shot() { google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --default-background-color=00000000 \
                     --window-size=$1 --virtual-time-budget=1500 --screenshot="$PWD/_site/$2" "file://$PWD/scripts/$3"; }
          shot 1200,630 og.png og-card.html
          shot 64,64 favicon.png 'favicon.html?size=64'
          shot 180,180 apple-touch-icon.png 'favicon.html?size=180&square'
          for f in og.png favicon.png apple-touch-icon.png; do test -s "_site/$f"; done
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
