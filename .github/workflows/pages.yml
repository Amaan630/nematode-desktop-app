# Publishes the website (site/) to GitHub Pages, with the app's own drawing code and icons.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/nematode.js', 'build/icon-*.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site/icons && cp site/index.html src/nematode.js _site/ && cp build/icon-*.png _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
