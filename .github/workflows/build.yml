# Builds the Mac .dmg and the Windows installer.
# Push a tag like v0.2.0 (matching the app version) to also publish a GitHub Release with latest.json,
# which installed apps check for updates. Run it from the Actions tab to just build.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
jobs:
  build:
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - if: matrix.os == 'macos-latest'
        run: ./scripts/build-mac.sh --target universal-apple-darwin
      - if: matrix.os == 'windows-latest'
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nematode-${{ matrix.os }}
          path: |
            src-tauri/target/**/bundle/Nematode.dmg
            src-tauri/target/**/bundle/macos/Nematode.app.tar.gz*
            src-tauri/target/**/bundle/nsis/*-setup.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish release with latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir out
          # Plain names people can tell apart; the update package and latest.json are for the app itself.
          cp "$(find artifacts -name Nematode.dmg | head -1)" out/Nematode-Mac.dmg
          cp "$(find artifacts -name '*-setup.exe' | head -1)" out/Nematode-Windows-Setup.exe
          cp "$(find artifacts -name '*-setup.exe.sig' | head -1)" out/win.sig
          cp "$(find artifacts -name Nematode.app.tar.gz | head -1)" out/Nematode-Mac-update.app.tar.gz
          cp "$(find artifacts -name Nematode.app.tar.gz.sig | head -1)" out/mac.sig
          cd out
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq -n --arg v "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" \
            --rawfile mac mac.sig --rawfile win win.sig '
            {version: $v, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac, url: "\($base)/Nematode-Mac-update.app.tar.gz"},
              "darwin-x86_64":  {signature: $mac, url: "\($base)/Nematode-Mac-update.app.tar.gz"},
              "windows-x86_64": {signature: $win, url: "\($base)/Nematode-Windows-Setup.exe"}
            }}' > latest.json
          cat latest.json
          cat > notes.md <<NOTES
          ### Download

          - **Mac:** [Nematode-Mac.dmg]($base/Nematode-Mac.dmg)
          - **Windows:** [Nematode-Windows-Setup.exe]($base/Nematode-Windows-Setup.exe)

          Already installed? It updates itself. The other files below are for those automatic updates.
          NOTES
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Nematode $TAG" --notes-file notes.md \
            Nematode-Mac.dmg Nematode-Windows-Setup.exe Nematode-Mac-update.app.tar.gz latest.json
