# Builds the Mac .dmg and the Windows installer.
# Push a tag like v0.2.0 (matching the app version) to also publish a GitHub Release with latest.json,
# which installed apps check for updates. Run it from the Actions tab to just build.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
jobs:
  build:
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the other
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - if: matrix.os == 'macos-latest'
        run: ./scripts/build-mac.sh --target universal-apple-darwin
      - if: matrix.os == 'windows-latest'
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nematode-${{ matrix.os }}
          path: |
            src-tauri/target/**/bundle/Nematode.dmg
            src-tauri/target/**/bundle/macos/Nematode.app.tar.gz*
            src-tauri/target/**/bundle/nsis/*-setup.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish release with latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir out
          find artifacts -type f \( -name 'Nematode.dmg' -o -name 'Nematode.app.tar.gz*' -o -name '*-setup.exe*' \) -exec cp {} out/ \;
          cd out
          ls -la
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          exe=$(ls *-setup.exe | head -1)
          jq -n --arg v "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" --arg exe "$exe" \
            --rawfile mac Nematode.app.tar.gz.sig --rawfile win "$exe.sig" '
            {version: $v, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac, url: "\($base)/Nematode.app.tar.gz"},
              "darwin-x86_64":  {signature: $mac, url: "\($base)/Nematode.app.tar.gz"},
              "windows-x86_64": {signature: $win, url: "\($base)/\($exe)"}
            }}' > latest.json
          cat latest.json
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Nematode $TAG" --generate-notes \
            Nematode.dmg Nematode.app.tar.gz "$exe" latest.json
